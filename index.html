<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Sarah</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --rose:    #e8506a;
      --pale:    #fde8ec;
      --ink:     #1c0f14;
      --muted:   #8a6070;
      --cream:   #fdf6f0;
    }

    body {
      min-height: 100vh;
      background: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
      position: relative;
    }

    /* Subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
    }

    /* Soft bloom */
    .bloom {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .bloom-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(232,80,106,0.18) 0%, transparent 70%);
      top: -100px; right: -100px;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .bloom-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(232,80,106,0.10) 0%, transparent 70%);
      bottom: -80px; left: -80px;
      animation: drift 22s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 30px) scale(1.08); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(28, 15, 20, 0.85);
      border: 1px solid rgba(232, 80, 106, 0.25);
      border-radius: 4px;
      padding: 3.5rem 3rem 3rem;
      width: min(440px, 92vw);
      text-align: center;
      backdrop-filter: blur(18px);
      box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03) inset;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .seal {
      font-size: 2.8rem;
      margin-bottom: 1.6rem;
      display: block;
      animation: heartbeat 3s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%       { transform: scale(1.18); }
      28%       { transform: scale(1); }
      42%       { transform: scale(1.1); }
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 600;
      color: var(--pale);
      letter-spacing: 0.06em;
      margin-bottom: 0.35rem;
    }

    .tagline {
      font-size: 1rem;
      font-style: italic;
      color: var(--muted);
      margin-bottom: 2.4rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(232, 80, 106, 0.3);
      border-radius: 3px;
      color: var(--pale);
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-align: center;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
    }
    input[type="password"]::placeholder {
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.05em;
    }
    input[type="password"]:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(232, 80, 106, 0.12);
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 1.1rem;
      padding: 0.9rem;
      background: var(--rose);
      color: #fff;
      border: none;
      border-radius: 3px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
    }
    .btn:hover {
      background: #d03d58;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(232, 80, 106, 0.35);
    }
    .btn:active { transform: translateY(0); }

    .error {
      margin-top: 1rem;
      font-size: 0.88rem;
      color: #ff8a99;
      font-style: italic;
      min-height: 1.2rem;
      transition: opacity 0.3s;
    }

    .hint {
      margin-top: 2rem;
      font-size: 0.82rem;
      color: rgba(138, 96, 112, 0.6);
      font-style: italic;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.03em;
    }

    /* Shake animation on wrong password */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-5px); }
      80%       { transform: translateX(5px); }
    }
    .shake { animation: shake 0.45s ease; }
  </style>
</head>
<body>

  <div class="bloom bloom-1"></div>
  <div class="bloom bloom-2"></div>

  <div class="card" id="card">
    <span class="seal">🌹</span>
    <h1>For Sarah</h1>
    <p class="tagline">a small letter, with a lot of heart</p>

    <input type="password" id="pwd" placeholder="enter the secret..." autocomplete="off" />
    <button class="btn" onclick="unlock()">Open ✦</button>
    <p class="error" id="err"></p>

    <p class="hint">💡 think of something precious to you both...</p>
  </div>

  <script src="gate.js"></script>
</body>
</html>
